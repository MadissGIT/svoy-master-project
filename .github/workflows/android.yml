name: Android build and launch
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check survey markup and order scenarios
        run: dotnet run --project Tests/ScenarioChecks/ScenarioChecks.csproj
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Build both Android applications
        run: |
          dotnet build Homework/MovieSurvey/MovieSurvey.csproj -c Release -p:TargetFrameworks=net10.0-android -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME"
          dotnet build Project/SvoyMaster/SvoyMaster.csproj -c Release -p:TargetFrameworks=net10.0-android -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch both applications on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash Tests/android-smoke.sh
      - name: Save APKs and launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-apps-and-smoke
          path: |
            Homework/MovieSurvey/bin/Release/**/*-Signed.apk
            Project/SvoyMaster/bin/Release/**/*-Signed.apk
            artifacts/smoke/
          if-no-files-found: error
