name: Build and check questionnaire
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify assignment requirements
        run: python scripts/check_requirements.py
      - name: Install MAUI for Windows
        run: dotnet workload install maui-windows
      - name: Build Windows application
        run: dotnet build TravelSurvey.csproj -f net10.0-windows10.0.19041.0 -p:TargetFrameworks=net10.0-windows10.0.19041.0 -c Debug
